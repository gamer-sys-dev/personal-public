<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#12131c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Emberwake">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg">
<title>Emberwake</title>
<style>
  :root {
    --bg:#12131c; --panel:#1c1e2b; --panel2:#24273a; --line:#33374d; --ink:#ece6d6; --muted:#9a96a8;
    --gold:#e0b252; --ember:#ff8a3d; --hp:#5fbf6a; --hplow:#e0574a; --mp:#5a9cff; --atb:#e8c84a; --bad:#e0574a; --good:#7fd08a;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size:16px; }
  body { min-height:100vh; overscroll-behavior:none; }
  #app { max-width:540px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 20px); }
  h1, h2, h3, .serif { font-family: Georgia, "Times New Roman", serif; font-weight:normal; letter-spacing:.01em; }
  h1 { font-size:1.6rem; margin:6px 0 4px; color:var(--gold); }
  h2 { font-size:1.15rem; margin:0 0 8px; color:var(--gold); }
  h3 { font-size:1rem; margin:12px 0 6px; }
  p { line-height:1.45; margin:6px 0; }
  .muted { color:var(--muted); font-size:.88rem; }
  .small { font-size:.82rem; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; margin:10px 0; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .row > .grow { flex:1; min-width:0; }
  .spread { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  button { font:inherit; color:var(--ink); background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:11px 14px; cursor:pointer; touch-action:manipulation; }
  button:active { transform:scale(.97); }
  button:disabled { opacity:.4; }
  button.primary { background:linear-gradient(180deg,#ff9a4d,#d8642a); border-color:#ff9a4d; color:#1b0f06; font-weight:700; }
  button.gold { border-color:var(--gold); color:var(--gold); }
  button.big { width:100%; padding:16px; font-size:1.05rem; margin-top:8px; }
  button.sm { padding:6px 10px; font-size:.85rem; border-radius:9px; white-space:nowrap; }
  button.link { background:none; border:none; color:var(--muted); padding:6px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
  .goldtxt { color:var(--gold); font-weight:600; }
  .bar { height:8px; border-radius:5px; background:#0b0c12; overflow:hidden; border:1px solid #000; }
  .bar > i { display:block; height:100%; background:var(--hp); transition:width .25s; }
  .bar.mp > i { background:var(--mp); }
  .bar.xp > i { background:var(--gold); }
  .bar.atb > i { background:var(--atb); transition:width .2s linear; }
  .bar.low > i { background:var(--hplow); }
  img.px { image-rendering:pixelated; image-rendering:crisp-edges; display:block; }
  .hero-mini { display:grid; grid-template-columns:44px 1fr; gap:10px; align-items:center; padding:6px 0; }
  .hero-mini img { width:44px; height:44px; object-fit:contain; }
  .hero-mini.ko img { filter:grayscale(1) brightness(.6); transform:rotate(90deg); }
  .stats { display:grid; grid-template-columns:1fr 1fr; gap:4px 16px; font-size:.92rem; }
  .stats div { display:flex; justify-content:space-between; border-bottom:1px solid var(--line); padding:4px 0; }
  .tabs { display:flex; gap:6px; overflow-x:auto; margin:8px 0; }
  .tabs button { flex:0 0 auto; border-radius:20px; padding:8px 14px; font-size:.9rem; }
  .tabs button.on { background:var(--gold); color:#1b1406; border-color:var(--gold); font-weight:700; }
  .herotabs { display:flex; gap:8px; }
  .herotabs button { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:8px; }
  .herotabs button.on { border-color:var(--gold); background:#2c2a24; }
  .herotabs img { width:40px; height:40px; }
  .pill { display:inline-block; font-size:.72rem; padding:2px 7px; border-radius:20px; border:1px solid var(--line); color:var(--muted); margin:1px; white-space:nowrap; }
  .pill.on { color:var(--gold); border-color:var(--gold); }
  .pill.bad { color:var(--bad); border-color:var(--bad); }
  .pill.good { color:var(--good); border-color:var(--good); }
  .list > div { padding:10px 0; border-bottom:1px solid var(--line); }
  .list > div:last-child { border-bottom:none; }
  .dots { letter-spacing:2px; font-size:.9rem; }
  details { border-bottom:1px solid var(--line); padding:8px 0; }
  details summary { list-style:none; cursor:pointer; }
  details summary::-webkit-details-marker { display:none; }
  .rank { padding:5px 0 5px 10px; font-size:.88rem; border-left:3px solid var(--line); margin:4px 0; }
  .rank.have { border-color:var(--gold); }
  .rank.next { border-color:var(--ember); }
  .rank.locked { opacity:.55; }
  .up { color:var(--good); } .down { color:var(--bad); }
  .toast { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 24px); transform:translateX(-50%); background:#2c2a24; border:1px solid var(--gold); color:var(--ink); padding:10px 16px; border-radius:12px; z-index:50; max-width:90vw; text-align:center; animation:pop .2s; }
  @keyframes pop { from { transform:translateX(-50%) scale(.9); opacity:0; } }
  .overlay { position:fixed; inset:0; background:rgba(5,5,10,.82); z-index:40; display:flex; align-items:flex-end; justify-content:center; padding:16px 12px calc(env(safe-area-inset-bottom) + 16px); }
  .overlay.center { align-items:center; }
  .sheet { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px; width:100%; max-width:520px; max-height:85vh; overflow:auto; }
  .dialog { background:linear-gradient(180deg,#22253a,#181a28); border:2px solid #4a4f70; border-radius:14px; padding:16px; width:100%; max-width:520px; min-height:150px; position:relative; }
  .dialog .who { color:var(--gold); font-family:Georgia,serif; font-size:1.05rem; margin-bottom:6px; display:flex; gap:10px; align-items:center; }
  .dialog .who img { width:40px; height:40px; }
  .dialog .text { font-size:1.05rem; line-height:1.5; }
  .dialog .text.narr { font-style:italic; color:#d8d2c2; }
  .dialog .next { position:absolute; right:14px; bottom:10px; color:var(--muted); font-size:.8rem; }
  .title { text-align:center; padding-top:12vh; }
  .title h1 { font-size:2.6rem; letter-spacing:.06em; text-shadow:0 0 24px rgba(255,138,61,.5); }
  .flame { width:72px; height:72px; margin:0 auto; }
  textarea { width:100%; min-height:90px; background:#0b0c12; color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:10px; font:inherit; font-size:.8rem; }
  .eventtxt { font-size:1rem; line-height:1.45; min-height:3em; }

  /* Battle */
  #battle { position:fixed; inset:0; display:flex; flex-direction:column; background:var(--bg); z-index:20; }
  .field { position:relative; flex:0 0 auto; height:min(48vh, 400px); overflow:hidden; border-bottom:2px solid #000; }
  .field .sky { position:absolute; inset:0; }
  .field .ground { position:absolute; left:0; right:0; bottom:0; height:68%; }
  .field .bgimg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% 75%; }
  .foes { position:absolute; left:2%; top:24%; bottom:4%; width:60%; display:grid; grid-template-columns:1fr 1fr; align-content:center; align-items:end; justify-items:center; gap:4px 2px; }
  .foes.one { grid-template-columns:1fr; }
  .friends { position:absolute; right:3%; top:15%; bottom:1%; width:32%; display:flex; flex-direction:column; justify-content:space-evenly; align-items:center; }
  /* painted backgrounds: ground is the bottom of the picture, so both sides stand there.
     The party forms two staggered rows (back row behind, front row lower and on top). */
  .field.painted { height:min(58vh, 520px); }
  .field.painted .friends { top:50%; bottom:1%; right:4%; width:44%; display:grid; grid-template-columns:1fr 1fr; grid-auto-rows:1fr; align-items:end; justify-items:center; }
  .field.painted .friends .unit:nth-child(2) { margin-right:0; }
  .field.painted .friends .unit:nth-child(n+3) { translate:-16% 0; }
  .field.painted .friends .unit:not(.pet) .spr img.paint { max-width:21vw; object-fit:contain; object-position:50% 100%; }
  .field.painted .foes { top:48%; bottom:2%; }
  .unit { position:relative; display:flex; flex-direction:column; align-items:center; transition:transform .15s, opacity .4s, filter .3s; }
  .unit img { filter:drop-shadow(0 2px 0 rgba(0,0,0,.25)); }
  .spr { position:relative; display:flex; justify-content:center; }
  .spr::after { content:''; position:absolute; left:12%; right:12%; bottom:-4px; height:9px; background:radial-gradient(ellipse at center, rgba(0,0,0,.45), rgba(0,0,0,0) 70%); z-index:-1; }
  .unit.pet { margin-right:40px; }
  .friends.many { display:grid; grid-template-columns:1fr 1fr; align-content:space-evenly; justify-items:center; width:40%; }
  .friends.many .unit.pet { margin-right:0; }
  .selbar { font-size:.82rem; background:#1c2a3a; border:1px solid #3a5a7a; border-radius:10px; padding:6px 10px; margin:6px 0; }
  .odds { margin-top:8px; padding:8px; border:1px solid var(--line); border-radius:10px; background:rgba(0,0,0,.2); }
  .field.surgeflash::after { content:''; position:absolute; inset:0; background:radial-gradient(circle, rgba(255,170,60,.65), rgba(255,90,20,0) 70%); animation:sflash .7s; pointer-events:none; }
  @keyframes sflash { from { opacity:1; } to { opacity:0; } }
  .banner.big { font-size:1.3rem; color:var(--ember); border-color:var(--ember); }
  .surgewrap { display:flex; align-items:center; gap:6px; font-size:.72rem; color:var(--ember); flex:1; margin:0 10px; }
  .surgewrap .bar { flex:1; }
  .bar.surge > i { background:linear-gradient(90deg,#ff6a2a,#ffd76a); }
  .surgewrap.full .bar { box-shadow:0 0 8px #ff9a3d; }
  .surgebtn { width:100%; margin-bottom:8px; background:linear-gradient(90deg,#ff6a2a,#ffb84a); border-color:#ffd76a; color:#1b0f06; font-weight:800; animation:glow 1s infinite alternate; }
  @keyframes glow { to { box-shadow:0 0 14px #ff9a3d; } }
  .prow.pet { grid-template-columns:62px 1fr 1fr 54px; padding:5px 12px; }
  .mapwrap { background:radial-gradient(ellipse at center, #232638, #171925); border:1px solid var(--line); border-radius:14px; margin:8px 0; padding:4px; }
  .mapsvg { width:100%; display:block; max-height:52vh; }
  .strip { display:flex; gap:8px; margin:8px 0; }
  .strip-cell { flex:1; display:flex; gap:6px; align-items:center; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:5px 6px; min-width:0; }
  .strip-cell img { width:28px; height:28px; object-fit:contain; flex:0 0 auto; }
  .strip-cell .small { font-size:.7rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .strip-cell.ko { opacity:.45; }
  .bgc { position:absolute; inset:0; width:100%; height:100%; }
  .fxc { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:7; }
  .unit .spr img { animation:idle 1.7s ease-in-out infinite alternate; animation-delay:inherit; }
  .unit.ko .spr img { animation:none; }
  @keyframes idle { from { transform:translateY(0); } to { transform:translateY(-3px); } }
  .field.shake { animation:fshake .3s; }
  .field.shake2 { animation:fshake2 .45s; }
  @keyframes fshake2 { 0%,100% { transform:translate(0,0); } 15% { transform:translate(-12px,6px); } 30% { transform:translate(10px,-7px); } 45% { transform:translate(-8px,5px); } 60% { transform:translate(6px,-4px); } 80% { transform:translate(-3px,2px); } }
  .unit.impact .spr img { filter:brightness(0) invert(1) !important; transform:scale(1.14); animation-play-state:paused; }
  .field.hitflash::before, .field.hitflash2::before { content:''; position:absolute; inset:0; background:#fff; pointer-events:none; z-index:8; animation:hflash .22s forwards; }
  .field.hitflash2::before { background:radial-gradient(circle, #fff, #ffd27a 60%, rgba(255,140,40,.6)); animation-duration:.4s; }
  @keyframes hflash { from { opacity:.55; } to { opacity:0; } }
  .levelup { max-height:88vh; overflow-y:auto; }
  .lvtitle { text-align:center; color:var(--gold); font-size:1.6rem; animation:bmname .4s ease-out; }
  .lvcard { border:1px solid var(--line); border-radius:12px; padding:8px 10px; margin:8px 0; background:rgba(255,215,106,.04); }
  .lvnum { font-size:1.05rem; } .lvnum b { color:var(--gold); font-size:1.3rem; }
  .lvrow { display:grid; grid-template-columns:1fr 3.2em 1.2em 3.2em 3em; align-items:center; font-size:.9rem; padding:1px 0; text-align:right; }
  .lvrow > span:first-child { text-align:left; } .lvrow .arrow { text-align:center; color:var(--muted); }
  .lvrow b { color:#fff; } .lvrow .up { color:var(--good); font-weight:700; }
  .nextup { color:#ffe9b0; }
  .warnban { position:absolute; left:6%; right:6%; top:16%; z-index:9; text-align:center; background:rgba(40,8,8,.9); border:2px solid #e0574a; color:#ffd0c0; border-radius:12px; padding:8px 10px; font-weight:700; font-size:.95rem; animation:bmin .2s, warnpulse .6s 3; pointer-events:none; }
  .warnban.good { background:rgba(10,30,12,.9); border-color:#6ad07a; color:#d0ffd8; animation:bmin .2s; }
  @keyframes warnpulse { 50% { box-shadow:0 0 18px #e0574a; } }
  .unit.elite .spr img { filter:drop-shadow(0 0 3px #ffd76a) drop-shadow(0 0 6px #ff9a3d) !important; }
  .unit.elite .uname { color:#ffd76a; font-weight:700; }
  .unit.charging .spr { animation:charge .5s infinite alternate; }
  @keyframes charge { from { filter:drop-shadow(0 0 2px #ff3a1a); } to { filter:drop-shadow(0 0 12px #ff3a1a); } }
  .unit.marked .spr::before { content:'🎯'; position:absolute; top:-18px; font-size:1rem; z-index:3; animation:bob .5s infinite alternate; }
  .sts { color:#ffb0a0; }
  .huntcard { border-color:#6a4a2a; background:linear-gradient(180deg,#2a2018,#1c1a20); }
  .huntcard .apex { margin-top:10px; padding-top:8px; border-top:1px dashed #6a4a2a; }
  .huntcard .apex.gone { opacity:.6; }
  .bountyin { margin-top:10px; padding-top:8px; border-top:1px dashed #6a4a2a; }
  .pot { color:#ffd76a; letter-spacing:1px; } .pot .off { color:#3a3a48; }
  .card.advise, .lvcard.advise { border-color:#7a4a3a; }
  .advice { color:#ffb0a0; margin-top:6px; }
  button.bad { border-color:#e0574a; color:#ffb0a0; }
  .holdbtn.on { background:#2c3a24; border-color:#6ad07a; color:#d0ffd8; }
  .beastbox { margin-top:8px; padding-top:8px; border-top:1px dashed var(--line); }
  .beastbox summary { cursor:pointer; margin-top:6px; }
  .awaken { margin-top:10px; padding:8px 10px; border:1px solid #6a4a2a; border-radius:10px; background:linear-gradient(180deg,#2a2018,#1c1a20); }
  .awaken.done { border-color:var(--gold); }
  .warsvg { width:100%; display:block; max-height:58vh; }
  .warmy { padding:8px 0; border-bottom:1px solid var(--line); }
  .warmy.on { border-left:3px solid #7ad8ff; padding-left:8px; }
  .soldier { padding:8px 0; border-bottom:1px solid var(--line); cursor:pointer; }
  .kindlebtn { width:100%; margin-bottom:8px; background:linear-gradient(90deg,#3a0a0a,#8a2a10); border-color:#ff6a2a; color:#ffd0a0; font-weight:700; }
  .unit.lunge .spr { animation:lunge .32s ease-out; }
  @keyframes lunge { 40% { transform:translateX(calc(var(--dir, -1) * 34px)) scale(1.08); } 100% { transform:none; } }
  .unit.cast .spr img, .unit.castheal .spr img { animation:castglow .5s ease-out; }
  .unit.cast .spr { animation:castrise .5s ease-out; }
  .unit.castheal .spr { animation:castrise .5s ease-out; }
  @keyframes castrise { 40% { transform:translateY(-8px); } 100% { transform:none; } }
  @keyframes castglow { 50% { filter:drop-shadow(0 0 10px #a0c0ff) brightness(1.5); } }
  .unit.castheal .spr img { animation-name:healglow; }
  @keyframes healglow { 50% { filter:drop-shadow(0 0 10px #7aff9a) brightness(1.4); } }
  .unit.hit .spr { animation:recoil .28s ease-out; }
  @keyframes recoil { 30% { transform:translateX(calc(var(--kb, 1) * 10px)) rotate(4deg); } 100% { transform:none; } }
  .unit.dying { animation:dying .45s ease-in forwards; }
  @keyframes dying { to { opacity:0; transform:translateY(10px) scale(.8); filter:brightness(3) saturate(0); } }
  .unit.enraged .spr { transform:scale(1.18); transition:transform .4s; }
  .unit.enraged .spr img { filter:drop-shadow(0 0 4px #ff3a1a) drop-shadow(0 0 10px #ff3a1a) !important; }
  .field.phaseflash::before { content:''; position:absolute; inset:0; background:radial-gradient(circle, rgba(255,40,20,.55), rgba(80,0,0,.2) 70%); pointer-events:none; z-index:8; animation:hflash .9s forwards; }
  .cutin { position:absolute; left:-30%; top:50%; transform:translateY(-50%); opacity:.9; animation:cutin .75s ease-out forwards; filter:drop-shadow(0 0 16px #ff9a3d); }
  .bigmove.combo .cutin { filter:drop-shadow(0 0 16px #7ad8ff); }
  .bigmove.awaken .cutin { filter:drop-shadow(0 0 18px #ffd76a); }
  @keyframes cutin { 0% { left:-40%; } 30% { left:4%; } 80% { left:10%; opacity:.9; } 100% { left:14%; opacity:0; } }
  .bigmove.awaken b { color:#fff6c8; text-shadow:0 0 16px #ffd76a, 0 2px 0 #000; }
  .unit .spr img.paint { height:var(--ph, 100px); width:auto; image-rendering:auto; }
  .unit.hasart .spr::after { left:22%; right:22%; bottom:-2px; }
  .unit.pet .spr img.paint { height:calc(var(--ph) * var(--fs, 1) * 0.8); max-width:20vw; object-fit:contain; object-position:50% 100%; scale:-1 1; }
  /* evolved companions: same painting, tinted by the form they grew into */
  .unit.pet.evo-attack .spr img.paint { filter:sepia(.35) saturate(1.6) hue-rotate(-25deg) drop-shadow(0 0 4px rgba(255,80,40,.55)); }
  .unit.pet.evo-guard .spr img.paint { filter:saturate(.7) brightness(.95) drop-shadow(0 0 4px rgba(150,180,220,.6)); }
  .unit.pet.evo-support .spr img.paint { filter:brightness(1.08) drop-shadow(0 0 5px rgba(140,255,170,.6)); }
  .unit.pet.evo-final .spr img.paint { height:calc(var(--ph) * var(--fs, 1) * 0.92); }
  .unit.pet.alpha .spr img.paint { height:calc(var(--ph) * var(--fs, 1) * 1.0); }
  .foes .unit .spr img.paint { height:calc(var(--ph) * var(--fs, 1)); max-width:28vw; object-fit:contain; object-position:50% 100%; }
  .foes.one .unit .spr img.paint { max-width:56vw; }
  .foes .unit.boss.hasart .spr img.paint { height:calc(var(--ph) * 1.7 * var(--fs, 1)); }
  .dialog .who img.face { width:76px; height:96px; }
  img.face { object-fit:cover; object-position:50% 12%; image-rendering:auto; border-radius:6px; }
  .cutin img.face { border-radius:12px; box-shadow:0 0 0 2px rgba(255,215,106,.6); }
  .bigmove { position:absolute; inset:0; z-index:9; display:flex; flex-direction:column; align-items:center; justify-content:center; background:rgba(4,4,12,.62); pointer-events:none; animation:bmin .18s; }
  .bigmove small { font-size:.75rem; letter-spacing:.25em; text-transform:uppercase; color:#ffd27a; }
  .bigmove b { font-family:Georgia,serif; font-size:1.9rem; color:#fff; text-shadow:0 0 12px #ff9a3d, 0 2px 0 #000; animation:bmname .35s ease-out; }
  .bigmove.surge b { color:#ffe9b0; font-size:2.1rem; text-shadow:0 0 18px #ff6a2a, 0 2px 0 #000; }
  .bigmove.combo b { text-shadow:0 0 14px #7ad8ff, 0 2px 0 #000; }
  .bigmove.out { opacity:0; transition:opacity .4s; }
  @keyframes bmin { from { opacity:0; } }
  @keyframes bmname { from { transform:scale(1.8); opacity:0; letter-spacing:.3em; } }
  @keyframes fshake { 0%,100% { transform:translate(0,0); } 20% { transform:translate(-6px,3px); } 40% { transform:translate(5px,-3px); } 60% { transform:translate(-4px,2px); } 80% { transform:translate(3px,-1px); } }
  .keepscene { width:100%; height:auto; aspect-ratio:100/53; display:block; border-radius:14px; border:1px solid var(--line); margin:6px 0 2px; background:#2a3a24; }
  .card.defend { border-color:#5a4a2a; background:linear-gradient(180deg,#24263a,#1c1e2b); }
  .card.defend.alert { border-color:var(--ember); box-shadow:0 0 18px rgba(255,138,61,.18); }
  .card.town { border-color:#6a5a3a; }
  .bout { border-top:1px solid var(--line); padding:10px 0; }
  .bout.final { border-left:3px solid var(--bad); padding-left:10px; }
  .bout.won { opacity:.75; }
  .stars { font-size:2.2rem; color:var(--gold); letter-spacing:6px; text-shadow:0 0 12px rgba(255,200,80,.5); }
  /* Siege */
  #siege { position:fixed; inset:0; z-index:25; background:#08090f; display:flex; flex-direction:column; user-select:none; -webkit-user-select:none; }
  .sg-top { display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px; padding:calc(env(safe-area-inset-top) + 6px) 10px 6px; background:#12131c; border-bottom:1px solid var(--line); }
  .sg-top > div:first-child { flex:1 1 auto; }
  .sg-hp { order:3; flex:1 1 100%; display:grid; grid-template-columns:auto 1fr auto 1fr; gap:4px 6px; align-items:center; font-size:.68rem; color:var(--muted); }
  .sg-hp .bar i { background:#c8a040; }

  .sg-stage { flex:1 1 auto; position:relative; min-height:0; }

  .sg-banner { position:absolute; top:12%; left:50%; transform:translateX(-50%) scale(.9); background:rgba(10,10,20,.85); border:1px solid #5a5f80; color:#ffe9b0; border-radius:12px; padding:8px 16px; font-family:Georgia,serif; font-size:1.05rem; opacity:0; transition:opacity .2s, transform .2s; pointer-events:none; white-space:nowrap; z-index:3; }

  .sg-hint { position:absolute; left:8px; right:8px; bottom:8px; background:rgba(20,18,12,.88); border:1px solid var(--gold); border-radius:10px; padding:8px 10px; font-size:.85rem; display:none; z-index:3; pointer-events:none; }
  .sg-bottom { flex:0 0 auto; background:#12131c; border-top:1px solid var(--line); padding:6px 8px calc(env(safe-area-inset-bottom) + 8px); }

  .sg-card.poor { opacity:.45; }
  .sg-heroes { display:flex; gap:6px; }
  .sg-hero { flex:1; display:flex; align-items:center; gap:6px; padding:6px; font-size:.75rem; position:relative; overflow:hidden; text-align:left; }
  .sg-hero img { width:30px; height:30px; object-fit:contain; flex:0 0 auto; }

  .sg-hero .cdv { position:absolute; left:0; right:0; bottom:0; height:0; background:rgba(0,0,0,.55); pointer-events:none; }
  .sg-hero.ready { border-color:var(--ember); }
  .sg-hero.done { opacity:.5; }

  #sgstart { margin-top:6px; }
  .sg-sel { display:none; align-items:center; gap:6px; padding:4px 0 2px; flex-wrap:wrap; font-size:.82rem; color:#7ad8ff; }

  .sg-plan { display:none; align-items:center; justify-content:space-between; gap:6px; flex-wrap:wrap; padding:6px 8px; margin:4px 0; border:1px dashed var(--gold); border-radius:10px; background:#1e1c14; color:#ffe9b0; }

  .sg-tabs { display:flex; gap:4px; margin:6px 0 2px; }

  .sg-panel { min-height:104px; }
  .sg-zoom { position:absolute; right:8px; top:8px; display:flex; flex-direction:column; gap:6px; z-index:3; }

  .fcard { min-width:74px; }
  .fcard b { font-size:.66rem; }
  .sw { display:block; width:26px; height:26px; border-radius:4px; border:1px solid rgba(0,0,0,.5); }
  .sw-wall { background:linear-gradient(#b8b4ac 30%,#9a968e 30%); }
  .sw-tower { background:linear-gradient(#c0bcb4 35%,#a8a49c 35%); border-width:3px; }
  .sw-moat { background:repeating-linear-gradient(0deg,#2a5a8a 0 5px,#3a6a9a 5px 7px); }
  .sw-stakes { background:repeating-linear-gradient(60deg,#6a8a4a 0 4px,#8a6438 4px 6px); }
  .sw-pit { background:radial-gradient(#0a0806 45%,#6a5a40 50%); }
  .sw-pitch { background:#120e0a; }
  .sw-brazier { background:radial-gradient(#ffd27a 25%,#ff8a3d 40%,#4a4a52 45%); }
  .sw-mangonel { background:linear-gradient(135deg,#7a5232 40%,#8a6438 40% 55%,#7a5232 55%); }
  .sw-demolish { background:repeating-linear-gradient(45deg,#e0574a 0 4px,#3a2020 4px 8px); }
  .evobtn { display:flex; flex-direction:column; align-items:flex-start; text-align:left; width:100%; margin-top:6px; gap:2px; }
  .evobtn .small { color:var(--ink); opacity:.8; }
  .evo { display:flex; justify-content:center; align-items:center; gap:16px; font-size:1.6rem; color:var(--gold); margin:10px 0; }
  .friends .unit:nth-child(2) { margin-right:26px; }
  .unit .uname { font-size:.68rem; background:rgba(0,0,0,.55); padding:1px 5px; border-radius:6px; margin-top:2px; white-space:nowrap; max-width:150px; overflow:hidden; text-overflow:ellipsis; }
  .unit .hpmini { width:60px; height:5px; background:#0b0c12; border-radius:3px; overflow:hidden; margin-top:2px; }
  .unit .hpmini i { display:block; height:100%; background:var(--bad); transition:width .3s; }
  .unit .sts { font-size:.6rem; min-height:.8rem; color:#ffd; text-shadow:0 1px 2px #000; }
  .unit.ko { opacity:0; transform:scale(.8); pointer-events:none; }
  .friends .unit.ko { opacity:.6; filter:grayscale(1); transform:rotate(-90deg) scale(.8); }
  .unit.active img { filter:drop-shadow(0 0 6px #ffd76a) drop-shadow(0 3px 0 rgba(0,0,0,.35)); }
  .unit.step { transform:translateX(-18px); }
  .foes .unit.step { transform:translateX(18px); }
  .unit.hit { animation:shake .3s; }
  .unit.flash img { animation:flash .3s; }
  @keyframes shake { 0%,100% { transform:translateX(0); } 25% { transform:translateX(-5px); } 75% { transform:translateX(5px); } }
  @keyframes flash { 50% { filter:brightness(3); } }
  .unit.targetable { cursor:pointer; }
  .unit.targetable::after { content:'▼'; position:absolute; top:-18px; color:var(--atb); font-size:1rem; animation:bob .6s infinite alternate; text-shadow:0 1px 2px #000; }
  @keyframes bob { to { transform:translateY(4px); } }
  .float { position:absolute; top:10%; left:50%; transform:translateX(-50%); font-weight:800; font-size:1.25rem; color:#fff; text-shadow:0 2px 0 #000, 0 0 4px #000; pointer-events:none; animation:floatup 1s forwards; white-space:nowrap; z-index:5; }
  .float.heal { color:#7fff8a; } .float.mp { color:#8ac0ff; } .float.crit { color:#ffd23a; font-size:1.9rem; } .float.weak { color:#ff9a3d; font-size:1.75rem; } .float.huge { color:#fff2a0; font-size:2.5rem; text-shadow:0 0 10px #ff6a2a, 0 2px 0 #000; } .float.resist { color:#b0b8c8; font-size:1rem; } .float.label { font-size:.8rem; color:#ffe9b0; top:-6%; } .float.label.crit { color:#ffd23a; font-size:.85rem; letter-spacing:.08em; } .float.label.weak { color:#ff9a3d; font-size:.85rem; letter-spacing:.08em; }
  @keyframes floatup { 0% { opacity:0; transform:translate(-50%,10px); } 15% { opacity:1; transform:translate(-50%,0); } 100% { opacity:0; transform:translate(-50%,-34px); } }
  .banner { position:absolute; top:8px; left:50%; transform:translateX(-50%); background:rgba(10,10,20,.85); border:1px solid #5a5f80; border-radius:10px; padding:6px 14px; font-family:Georgia,serif; font-size:1rem; opacity:0; transition:opacity .15s; pointer-events:none; white-space:nowrap; z-index:6; }
  .banner.show { opacity:1; }
  .pbars { flex:0 0 auto; background:#161826; border-bottom:1px solid var(--line); }
  .prow { display:grid; grid-template-columns:62px 1fr 1fr 54px; gap:8px; align-items:center; padding:7px 12px; border-bottom:1px solid #22253a; font-size:.82rem; }
  .prow.active { background:#2c2a20; }
  .prow.ko { opacity:.5; }
  .prow .nm { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .prow .num { font-size:.72rem; color:var(--muted); display:flex; justify-content:space-between; }
  .prow .sts { font-size:.62rem; color:var(--atb); }
  .cmd { flex:1 1 auto; overflow:auto; padding:10px 12px calc(env(safe-area-inset-bottom) + 10px); }

  .autobtn.on { background:var(--atb); color:#1b1406; border-color:var(--atb); font-weight:700; }
